# cargo-features = ["profile-rustflags"]
[package]
name = "term-boss"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "^1.0.104"
base64 = "^0.23.1"
libc = "^0.2"
clap = { version = "^4.6.7", default-features = false,  features = ["std", "help", "usage", "error-context", "derive", "env"] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.154", features = ["preserve_order"] }
toml = { version = "^1.1", default-features = false, features = ["parse", "serde"] }
strum = { version = "^0.28", features = ["std", "derive"] }
