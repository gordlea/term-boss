# Copy this to ~/.config/term-boss/user-base-config.toml (or, for every user on the host,
# /etc/term-boss/hostwide-base-config.toml).
#
# The base configs sit beneath every directory, so leaving a themed project (cd ~, /tmp or any
# directory without its own config) restores the terminal's default tab, colours and palette.
# Projects that set their own values still win, because nearer configs override farther ones.
#
# $HOME/.term-boss.toml also works, but only for directories under $HOME, because it is found
# by the parent-directory walk rather than read as a base config.
reset = true

# This is also a good place for colour schemes you want available in every project:
#
# [color_schemes.mine.colors.primary]
# background = "#101010"
# foreground = "#f0f0f0"
